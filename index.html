<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const T = {}; D.teams.forEach(t => T[t.id] = t);
  const WEEKS = [...new Set(D.games.map(g => g.w))].sort((a, b) => a - b);
  const N = D.playoff_teams;
  const key = g => `${g.w}-${g.a}-${g.b}`;
  const STORE = 'theta-picks-v3';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
  const wl = (w, l) => `${w}–${l}`;
  const ord = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'));
  const fav = g => (T[g.a].proj[g.w] >= T[g.b].proj[g.w] ? g.a : g.b);
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CHECK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let picks = null, week = WEEKS[0], view = 'games';
  try { picks = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) {}
  if (!picks || typeof picks !== 'object') picks = {};
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(picks)); } catch (e) {} };

  function standings() {
    const s = {};
    D.teams.forEach(t => s[t.id] = { t, w: t.w, l: t.l, pf: t.pf + WEEKS.reduce((a, w) => a + (t.proj[w] || 0), 0) });
    D.games.forEach(g => { const p = picks[key(g)]; if (!p) return; s[p].w++; s[p === g.a ? g.b : g.a].l++; });
    const cmp = (a, b) => b.w - a.w || b.pf - a.pf;
    return Object.values(s).sort(cmp);
  }

  function seg(el, items, active) {
    el.style.gridTemplateColumns = `repeat(${items.length}, 1fr)`;
    if (!el.querySelector('.thumb')) el.insertAdjacentHTML('afterbegin', '<span class="thumb" aria-hidden="true"></span>');
    el.querySelectorAll('button').forEach(b => b.remove());
    el.insertAdjacentHTML('beforeend', items.map(it => it.html).join(''));
    moveThumb(el, items.findIndex(it => it.id === active), items.length);
  }
  function moveThumb(el, i, n) {
    const th = el.querySelector('.thumb');
    th.style.width = `calc((100% - 4px) / ${n})`;
    th.style.transform = `translateX(${i * 100}%)`;
  }

  function renderWeekSeg() {
    seg(document.getElementById('weekseg'), WEEKS.map(w => {
      return { id: w, html: `<button data-w="${w}" aria-pressed="${w === week}" aria-label="Week ${w}">Wk ${w}</button>` };
    }), week);
  }

  // Team logo over the abbreviation; if the image fails, it removes itself and the abbreviation shows.
  const mono = t => `<span class="mono" aria-hidden="true">${esc(t.abbrev)}${t.logo ? `<img src="${esc(t.logo)}" alt="" referrerpolicy="no-referrer" onload="this.classList.add('ok')" onerror="this.remove()">` : ''}</span>`;

  // Last name only ("Robinson", "Fannin Jr."), team name for a D/ST, so a team's byes fit on one line.
  function shortName(b) {
    if (b.pos === 'D/ST') return b.n.replace(/\s*D\/ST$/, '');
    const parts = b.n.split(' ');
    return parts.length < 2 ? b.n : parts.slice(1).join(' ');
  }
  // One tag per team listing only the starters who are on bye that week.
  function byeLine(t, w) {
    const list = (t.byes[w] || []).filter(b => b.st);
    if (!list.length) return '<span class="byes" aria-hidden="true"><span class="btag none"><b>BYES:</b></span></span>';
    const items = list.map((b, i) => `${i ? '<span class="dot">&middot;</span>' : ''}<span class="it" title="${esc(b.n)}">${esc(shortName(b))}<i>${b.pos}</i></span>`).join('');
    return `<span class="byes"><span class="btag"><b>BYES:</b>${items}</span></span>`;
  }

  function side(g, id) {
    const t = T[id], p = picks[key(g)];
    const st = !p ? '' : p === id ? ' win' : ' loss';
    return `<button class="side${st}" data-k="${key(g)}" data-id="${id}" aria-pressed="${p === id}" aria-label="Pick ${esc(t.name)}">
      ${mono(t)}
      <span class="who"><span class="nm">${esc(t.name)}</span><span class="sub">${wl(t.w, t.l)}</span></span>
      <span class="sc">${f1(t.proj[g.w] || 0)}</span>
      <span class="mark" aria-hidden="true">${CHECK}</span>${byeLine(t, g.w)}</button>`;
  }

  function enter(el) { if (calm) return; el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); }

  function renderGames(animate) {
    const gs = D.games.filter(g => g.w === week);
    const el = document.getElementById('games');
    el.innerHTML = gs.map(g => `<div class="match">${side(g, g.a)}${side(g, g.b)}</div>`).join('');
    document.getElementById('wkh').textContent = `Week ${week}`;
    fitByes(el);
    if (animate) enter(el);
  }

  // Keep every BYES tag on one line: drop names from the end and show "+N" until it fits.
  function fitByes(root) {
    root.querySelectorAll('.btag').forEach(tag => {
      const its = [...tag.querySelectorAll('.it')];
      let hidden = 0;
      while (tag.scrollWidth > tag.clientWidth + 1 && hidden < its.length - 1) {
        hidden++;
        const it = its[its.length - hidden];
        if (it.previousElementSibling && it.previousElementSibling.classList.contains('dot')) it.previousElementSibling.remove();
        it.remove();
        let m = tag.querySelector('.more');
        if (!m) { m = document.createElement('span'); m.className = 'more'; tag.appendChild(m); }
        m.textContent = `+${hidden}`;
      }
    });
  }

  function paint(k) {
    document.querySelectorAll(`.side[data-k="${k}"]`).forEach(el => {
      const p = picks[k], id = Number(el.dataset.id);
      el.classList.toggle('win', p === id);
      el.classList.toggle('loss', !!p && p !== id);
      el.setAttribute('aria-pressed', p === id);
    });
  }

  function renderProgress() {
    const done = D.games.filter(g => picks[key(g)]).length;
    document.getElementById('prog-t').textContent = done === D.games.length ? 'All games picked' : `${done} of ${D.games.length} games picked`;
    document.getElementById('prog-b').style.width = `${(done / D.games.length) * 100}%`;
    const wk = D.games.filter(g => g.w === week), wd = wk.filter(g => picks[key(g)]).length;
    document.getElementById('wkn').textContent = `${wd} of ${wk.length} picked`;
  }

  function grow(r, i) {
    return `<div class="grow" data-id="${r.t.id}"><span class="sd">${i + 1}</span>${mono(r.t)}
      <span class="nm">${esc(r.t.name)}</span><span class="wl">${wl(r.w, r.l)}</span></div>`;
  }
  function renderTable(rows) {
    const before = {};
    document.querySelectorAll('.grow').forEach(el => before[el.dataset.id] = el.getBoundingClientRect().top);
    document.getElementById('g-in').innerHTML = rows.slice(0, N).map(grow).join('');
    document.getElementById('g-out').innerHTML = rows.slice(N).map((r, j) => grow(r, j + N)).join('');
    if (calm || view !== 'table') return;
    document.querySelectorAll('.grow').forEach(el => {
      const b = before[el.dataset.id]; if (b == null) return;
      const dy = b - el.getBoundingClientRect().top; if (!dy) return;
      el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.25,.8,.25,1)' });
    });
  }

  function refresh() { const rows = standings(); renderWeekSeg(); renderProgress(); renderTable(rows); }

  function setView(v) {
    if (v === view) return; view = v;
    const s = document.getElementById('viewseg');
    s.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v));
    moveThumb(s, v === 'games' ? 0 : 1, 2);
    document.getElementById('v-games').hidden = v !== 'games';
    document.getElementById('v-table').hidden = v !== 'table';
    document.getElementById('weekbar').hidden = v !== 'games';
    enter(v === 'games' ? document.getElementById('games') : document.getElementById('v-table'));
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.view) { setView(b.dataset.view); return; }
    if (b.dataset.w) { const w = Number(b.dataset.w); if (w === week) return; week = w; renderGames(true); refresh(); return; }
    if (b.dataset.k) {
      const id = Number(b.dataset.id);
      if (picks[b.dataset.k] === id) delete picks[b.dataset.k]; else picks[b.dataset.k] = id;
      save(); paint(b.dataset.k); refresh(); return;
    }
    const wk = D.games.filter(g => g.w === week);
    if (b.id === 'auto') wk.forEach(g => picks[key(g)] = fav(g));
    else if (b.id === 'clearwk') wk.forEach(g => delete picks[key(g)]);
    else if (b.id === 'clearall') picks = {};
    else return;
    save(); wk.forEach(g => paint(key(g))); refresh();
  });

  const when = new Date(D.generated_at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  document.getElementById('eyebrow').textContent = `Theta · Weeks ${WEEKS[0]} to ${WEEKS[WEEKS.length - 1]}`;
  document.getElementById('foot').textContent = `Scores are each team's best lineup from ESPN projections as of ${when}. The BYES tag lists each team's usual starters who are on bye that week. Top ${N} records make the playoffs. Tied records are broken by total points, as set in the league's ESPN settings. Tap a team to pick it to win; tap again to undo. Picks are saved on this device only.`;
  moveThumb(document.getElementById('viewseg'), 0, 2);
  renderGames(false); refresh();
})();
</script>
